name: Preview Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: londonnews
          POSTGRES_USER: londonnews
          POSTGRES_PASSWORD: londonnews
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U londonnews -d londonnews"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://londonnews:londonnews@127.0.0.1:54329/londonnews?schema=public
      DIRECT_DATABASE_URL: postgresql://londonnews:londonnews@127.0.0.1:54329/londonnews?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3005
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3005
      NEXTAUTH_SECRET: ci-secret
      CRON_SECRET: ci-cron-secret
      CRON_TOKEN: ci-cron-secret
      ALLOW_GUEST_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Build production app
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run smoke tests
        run: npx playwright test
        working-directory: apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
